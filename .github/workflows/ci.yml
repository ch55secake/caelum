name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      skip_bundle:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rust-format:
    name: rust-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: rust-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install Rust linter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev wget
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: rust-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev wget
      - uses: Swatinem/rust-cache@v2
      - run: /usr/bin/time -p cargo test --workspace
      - name: Install Blaze for comparison
        run: curl -fsSL https://ix.dev/blaze | sh -s -- --version 0.20261030.1 --no-toolchain
      - name: Compare workspace test runtime with Blaze
        continue-on-error: true
        env:
          BLAZE_HOME: ${{ runner.temp }}/blaze-home
          BLAZE_TESTS: all
          CARGO_TARGET_DIR: ${{ runner.temp }}/blaze-target
        run: /usr/bin/time -p blaze test --workspace

  macos-app:
    name: desktop-bundle-build
    if: ${{ inputs.skip_bundle != true }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @caelum/desktop tauri build --ci --bundles app,dmg -- --locked
        env:
          APPLE_SIGNING_IDENTITY: "-"

  desktop-frontend:
    name: desktop-frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @caelum/desktop build
      - run: pnpm --filter @caelum/desktop test
      - run: pnpm --filter @caelum/desktop exec playwright install --with-deps chromium
      - run: pnpm --filter @caelum/desktop test:ui

  release-package:
    name: release-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: bash -n scripts/release/package_macos_assets.sh

name: CI
on:
  # Main commits are checked by the release workflow's reusable CI run.
  pull_request:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      release_tag:
        type: string
        default: ''
      linux_desktop:
        type: boolean
        default: true
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MACOSX_DEPLOYMENT_TARGET: '13.0'
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      preview: ${{ steps.filter.outputs.preview }}
      bundle: ${{ steps.filter.outputs.bundle }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            preview:
              - '.github/workflows/ci.yml'
              - 'apps/desktop/src/**'
              - 'apps/desktop/assets/**'
              - 'apps/desktop/preview/**'
              - 'apps/desktop/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            bundle:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '**/*.rs'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'apps/desktop/assets/**'
              - 'apps/desktop/THIRD_PARTY_NOTICES.md'
              - 'scripts/release/**'

  rust-structure:
    name: rust-structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: caelurium/rust-structure@v1
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
          config: .github/rust-structure.json
  rust-format:
    name: rust-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - run: cargo fmt --all -- --check
  rust-clippy:
    name: rust-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-clippy
      - run: cargo clippy --locked --timings -p caelum-core -p caelum-protocol -p caelum-cli --all-targets -- -D warnings
      - name: Upload Cargo build timings
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cargo-timings-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
  rust-test:
    name: rust-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
      - run: cargo test --locked --timings -p caelum-core -p caelum-protocol -p caelum-cli -- --test-threads=4
      - name: Exercise the native workspace over OpenSSH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-asyncssh
          /usr/bin/python3 scripts/dev/smoke_native_workspace.py
      - name: Upload Cargo build timings
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cargo-timings-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
  native-desktop:
    name: native-desktop-tests
    needs: changes
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-desktop
      - run: cargo clippy --locked --timings -p caelum-desktop --all-targets -- -D warnings
      - run: cargo test --locked --timings -p caelum-desktop -- --test-threads=4
      - run: python3 scripts/dev/macos_app.py --build-only
      - run: python3 apps/desktop/preview/capture.py
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.preview == 'true' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.preview == 'true' }}
        with:
          name: native-design-previews
          path: apps/desktop/preview-results/
          if-no-files-found: error
      - name: Upload Cargo build timings
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cargo-timings-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
  macos-app:
    name: desktop-bundle-build
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.bundle == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          # PR and release packaging use the same dependency cache.
          shared-key: aarch64-apple-darwin-build
      - name: Build and verify native app, DMG and CLI archive
        env:
          TARGET: aarch64-apple-darwin
          ARCH: aarch64
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version_tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          RELEASE_TAG="${RELEASE_TAG:-$version_tag}"
          if [[ "$RELEASE_TAG" != "$version_tag" ]]; then
            echo "Tag $RELEASE_TAG must match project version $version_tag" >&2
            exit 1
          fi
          export RELEASE_TAG
          bash scripts/release/package_macos_assets.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-aarch64
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload Cargo build timings
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cargo-timings-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
  linux-desktop:
    name: Linux desktop
    # Recovery of historical macOS-only tags omits Linux; every PR includes it.
    if: ${{ github.event_name == 'pull_request' || inputs.linux_desktop }}
    uses: ./.github/workflows/linux-desktop.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
      release_tag: ${{ inputs.release_tag || '' }}
  release-package:
    name: release-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/profile -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/dev -p 'test_*.py'
      - run: python3 -m unittest discover -s apps/desktop/preview -p 'test_*.py'
      - name: Check packaging shell syntax
        run: |
          for script in scripts/release/package_macos_assets.sh \
            scripts/release/package_macos_app.sh scripts/release/macos_libraries.sh \
            scripts/release/package_linux_assets.sh apps/desktop/assets/linux/AppRun; do
            bash -n "$script"
          done

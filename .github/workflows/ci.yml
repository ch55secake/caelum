name: CI
on:
  # Main commits are checked by the release workflow's reusable CI run.
  pull_request:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      skip_bundle:
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MACOSX_DEPLOYMENT_TARGET: '13.0'
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      preview: ${{ steps.filter.outputs.preview }}
      bundle: ${{ steps.filter.outputs.bundle }}
    steps:
      - name: Keep reusable CI unfiltered
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Running full reusable CI checks."
      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            preview:
              - 'apps/desktop/src/**'
              - 'apps/desktop/assets/**'
              - 'apps/desktop/preview/**'
              - 'apps/desktop/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            bundle:
              - '**/*.rs'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'apps/desktop/assets/**'
              - 'apps/desktop/THIRD_PARTY_NOTICES.md'
              - 'scripts/release/**'

  rust-structure:
    name: rust-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Check module sizes and exception ratchet
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: python3 scripts/structure/check.py --base "$BASE_REVISION"
      - run: python3 -m unittest discover -s scripts/structure -p 'test_*.py'
  rust-format:
    name: rust-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - run: cargo fmt --all -- --check
  rust-clippy:
    name: rust-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p caelum-core -p caelum-protocol -p caelum-cli --all-targets -- -D warnings
  rust-test:
    name: rust-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p caelum-core -p caelum-protocol -p caelum-cli -- --test-threads=4
  native-desktop:
    name: native-desktop-tests
    needs: changes
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p caelum-desktop --all-targets -- -D warnings
      - run: cargo test --locked -p caelum-desktop -- --test-threads=4
      - run: python3 apps/desktop/preview/capture.py
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.preview == 'true' }}
      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.preview == 'true' }}
        with:
          name: native-design-previews
          path: apps/desktop/preview-results/
  macos-app:
    name: desktop-bundle-build
    needs: changes
    if: ${{ inputs.skip_bundle != true && (github.event_name != 'pull_request' || needs.changes.outputs.bundle == 'true') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Build and verify native app, DMG and CLI archive
        env:
          TARGET: aarch64-apple-darwin
          ARCH: aarch64
        run: |
          RELEASE_TAG="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          export RELEASE_TAG
          bash scripts/release/package_macos_assets.sh
      - uses: actions/upload-artifact@v7
        with:
          name: caelum-macos
          path: ${{ runner.temp }}/release/*
  release-package:
    name: release-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/profile -p 'test_*.py'
      - run: bash -n scripts/release/package_macos_assets.sh scripts/release/package_macos_app.sh scripts/release/macos_libraries.sh

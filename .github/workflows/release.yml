name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to recover or sync to Homebrew (for example v0.1.5)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Version-bump pushes must not replace a queued merge's release run.
  group: release-${{ github.workflow }}-${{ inputs.tag || (github.event.head_commit.author.name == 'github-actions[bot]' && github.sha) || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      release_commit: ${{ steps.tag.outputs.release_commit }}
      should_release: ${{ steps.tag.outputs.should_release }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/create-github-app-token@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: release-app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: caelum

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.release-app-token.outputs.token || github.token }}

      - name: Bump patch version, tag, and prepare release
        id: tag
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release/create_version_tag.py

      - name: Check for an already published release
        if: ${{ steps.tag.outputs.should_release == 'true' }}
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
        run: python3 scripts/release/publish_release.py --check

  checks:
    name: Check release commit
    needs: prepare
    if: ${{ needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.published != 'true' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.prepare.outputs.release_commit }}
      skip_bundle: true

  build:
    name: Build ${{ matrix.arch }} release assets
    needs: prepare
    if: ${{ needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.published != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          workspace_version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          tag = os.environ["RELEASE_TAG"]

          if tag != f"v{workspace_version}":
              raise SystemExit(f"Tag {tag} must match project version v{workspace_version}")
          PY

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Package architecture-specific release assets
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: bash scripts/release/package_macos_assets.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [prepare, checks, build]
    if: ${{ !cancelled() && needs.prepare.outputs.should_release == 'true' && (needs.prepare.outputs.published == 'true' || (needs.checks.result == 'success' && needs.build.result == 'success')) }}
    concurrency:
      group: publish-${{ github.repository }}-${{ needs.prepare.outputs.release_tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        if: ${{ needs.prepare.outputs.published != 'true' }}
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify assets and publish or resume the tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: python3 scripts/release/publish_release.py --assets dist

  update-homebrew-tap:
    name: Open Homebrew tap update
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.publish.result == 'success' && vars.HOMEBREW_TAP_UPDATES == 'enabled' && !contains(needs.prepare.outputs.release_tag, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" \
            --repo ch55secake/caelum \
            --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/release"

      - uses: actions/checkout@v7
        with:
          repository: ch55secake/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render Homebrew formula and cask
        working-directory: homebrew-tap
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          python3 scripts/render_caelum_release.py \
            "${RELEASE_TAG#v}" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            .

      - uses: peter-evans/create-pull-request@v8
        with:
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          branch: automation/caelum-${{ needs.prepare.outputs.release_tag }}
          delete-branch: true
          commit-message: "chore(caelum): update packages to ${{ needs.prepare.outputs.release_tag }}"
          title: "chore(caelum): update Homebrew packages to ${{ needs.prepare.outputs.release_tag }}"
          body: |
            Update the Caelum CLI formula and desktop cask for the latest release.

            Release: https://github.com/ch55secake/caelum/releases/tag/${{ needs.prepare.outputs.release_tag }}

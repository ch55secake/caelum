name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.sources.outputs.languages }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: changed
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            actions:
              - '.github/workflows/**'
              - '.github/actions/**/action.yml'
              - '.github/actions/**/action.yaml'
            javascript:
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.mts'
              - '**/*.cts'
            python:
              - '**/*.py'
            rust:
              - '**/*.rs'
      - id: sources
        name: Detect CodeQL source languages
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          ACTIONS_CHANGED: ${{ steps.changed.outputs.actions }}
          JAVASCRIPT_CHANGED: ${{ steps.changed.outputs.javascript }}
          PYTHON_CHANGED: ${{ steps.changed.outputs.python }}
          RUST_CHANGED: ${{ steps.changed.outputs.rust }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess
          from pathlib import PurePosixPath

          languages = []

          if os.environ["IS_PULL_REQUEST"] == "true":
              changed = {
                  "actions": os.environ["ACTIONS_CHANGED"] == "true",
                  "javascript-typescript": os.environ["JAVASCRIPT_CHANGED"] == "true",
                  "python": os.environ["PYTHON_CHANGED"] == "true",
                  "rust": os.environ["RUST_CHANGED"] == "true",
              }
              languages = [language for language, did_change in changed.items() if did_change]
          else:
              files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
              files = [path for path in files if path]
              suffixes = {path: PurePosixPath(path).suffix.lower() for path in files}

              if any(
                  path.startswith(".github/workflows/")
                  or (path.startswith(".github/actions/") and PurePosixPath(path).name in {"action.yml", "action.yaml"})
                  for path in files
              ):
                  languages.append("actions")
              if any(suffix in {".js", ".jsx", ".mjs", ".cjs", ".ts", ".tsx", ".mts", ".cts"} for suffix in suffixes.values()):
                  languages.append("javascript-typescript")
              if ".py" in suffixes.values():
                  languages.append("python")
              if ".rs" in suffixes.values():
                  languages.append("rust")

          print(f"languages={json.dumps(languages)}")
          PY

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect
    if: ${{ needs.detect.outputs.languages != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  codeql:
    name: CodeQL
    needs: [detect, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require source detection and analysis to succeed
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          test "$DETECT_RESULT" = success
          test "$ANALYZE_RESULT" = success || test "$ANALYZE_RESULT" = skipped

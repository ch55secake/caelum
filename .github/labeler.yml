"area: core":
  - changed-files:
      - any-glob-to-any-file: "crates/caelum-core/**"

"area: protocol":
  - changed-files:
      - any-glob-to-any-file: "crates/caelum-protocol/**"

"area: cli":
  - changed-files:
      - any-glob-to-any-file: "apps/cli/**"

"area: desktop":
  - changed-files:
      - any-glob-to-any-file: "apps/desktop/**"

"area: build":
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.toml"
          - "Cargo.lock"
          - "package.json"
          - "pnpm-workspace.yaml"
          - "pnpm-lock.yaml"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/labeler.yml"
          - ".github/dependabot.yml"
          - ".github/PULL_REQUEST_TEMPLATE.md"

"area: release":
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/release/**"
          - "docs/distribution/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "docs/**"
          - ".github/PULL_REQUEST_TEMPLATE.md"

"area: security":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/security/**"
          - "crates/caelum-core/src/permissions/**"
          - "apps/desktop/src-tauri/capabilities/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "docs/**"
          - ".github/PULL_REQUEST_TEMPLATE.md"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Cargo.toml"
          - "Cargo.lock"
          - "**/package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"

bug:
  - head-branch: ["^fix/", "^bugfix/"]

enhancement:
  - head-branch: ["^feat/", "^feature/"]

maintenance:
  - head-branch: ["^chore/", "^ci/", "^refactor/"]

core:
  - changed-files:
      - any-glob-to-any-file: "crates/caelum-core/**"

protocol:
  - changed-files:
      - any-glob-to-any-file: "crates/caelum-protocol/**"

cli:
  - changed-files:
      - any-glob-to-any-file: "apps/cli/**"

desktop:
  - changed-files:
      - any-glob-to-any-file: "apps/desktop/**"

build:
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.toml"
          - "Cargo.lock"
          - "rust-toolchain.toml"
          - "flake.nix"
          - "Makefile"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/labeler.yml"
          - ".github/dependabot.yml"
          - ".github/PULL_REQUEST_TEMPLATE.md"

release:
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/release/**"
          - "docs/distribution/**"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "docs/**"
          - ".github/PULL_REQUEST_TEMPLATE.md"

security:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/security/**"
          - "crates/caelum-core/src/permissions/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Cargo.toml"
          - "Cargo.lock"

bug:
  - head-branch: ["^fix/", "^bugfix/"]

enhancement:
  - head-branch: ["^feat/", "^feature/"]

maintenance:
  - head-branch: ["^chore/", "^ci/", "^refactor/"]

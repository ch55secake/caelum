[package]
name = "caelum-desktop"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false
license = "MIT"
description = "Caelum's native coding workspace"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "ddf14140253bd1b963993895e3fa025d1ec58537", default-features = false, features = ["accessibility", "metal-backend", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "ddf14140253bd1b963993895e3fa025d1ec58537", features = ["markdown"] }
serde.workspace = true
serde_json.workspace = true
caelum-core = { path = "../../crates/caelum-core" }
caelum-protocol = { path = "../../crates/caelum-protocol" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSString", "NSUUID"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }

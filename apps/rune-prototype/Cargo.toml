[package]
name = "caelum-rune-prototype"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Interactive visual comparison of Caelum's workspace in Rune"

# Keep the experiment's toolchain and rendering dependencies self-contained.
[workspace]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "ddf14140253bd1b963993895e3fa025d1ec58537", default-features = false, features = ["accessibility", "metal-backend"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "ddf14140253bd1b963993895e3fa025d1ec58537", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
debug = 0

[profile.release]
lto = "thin"
strip = true

[workspace]
resolver = "3"
members = [
  "crates/caelum-core",
  "crates/caelum-protocol",
  "apps/cli",
  "apps/desktop",
]

[workspace.package]
version = "0.1.29"
edition = "2021"
rust-version = "1.95"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev]
opt-level = 1
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
